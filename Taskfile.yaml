version: "3"

# Build/kit tasks for the agent mesh. Agent scaffolding is done by `meshctl agent
# new`; all embedded content (templates + doctrine) is source under
# internal/mesh/templates/, edited in place — nothing to sync.

tasks:
  default:
    desc: List available tasks
    cmds: ["task --list"]
    silent: true

  build:
    desc: "Build the meshctl binary."
    cmds:
      - go build ./...

  install:
    desc: "Install meshctl to \"$(command -v meshctl || echo ~/.local/bin/meshctl)\"."
    cmds:
      - go build -o "$(command -v meshctl || echo ~/.local/bin/meshctl)" ./cmd/meshctl
