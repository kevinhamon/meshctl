# Per-agent inputs — the only fields you edit when creating a new agent.
# Everything else (output filename, guid, description) is derived automatically:
#   output      = <name>.json
#   guid        = repo path (unique + stable per repo)
#   description = name
profile:
  name: __NAME__
  badge: __BADGE__

# Distinct badge color per agent (pick a distinct hue per agent, e.g. blue/green/amber).
# Pick an unused hue; values are 0..1.
badge:
  red: 0.50
  green: 0.50
  blue: 0.50
  alpha: 0.82
