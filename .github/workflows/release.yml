name: release

# Cross-compile meshctl for macOS/Linux/Windows on a version tag and attach the
# binaries (plus SHA-256 sums) to the GitHub release. Pure Go, CGO disabled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + attach assets to'
        required: true

permissions:
  contents: write

jobs:
  # Harness parity: every command classified per harness and the
  # README table current. Fast and deterministic; nothing is released without it.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Harness parity
        run: go test ./cmd/meshctl -run HarnessParity

  # Create the release once, before the matrix: five jobs racing
  # `gh release view || gh release create` made the losers fail on "already exists".
  release:
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"

  build:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: |
          set -euo pipefail
          go version
          BIN="meshctl_${{ matrix.goos }}_${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && BIN="${BIN}.exe"
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$BIN" ./cmd/meshctl
          sha256sum "$BIN" > "$BIN.sha256"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          # --clobber makes re-runs idempotent (replaces an asset of the same name).
          gh release upload "$TAG" "$BIN" "$BIN.sha256" --clobber
